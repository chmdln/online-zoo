<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Online Zoo</title>
</head>
<body>
    <header>
        <img 
            src="../../assets/images/logo.png" 
            alt="logo"
            class="logo-image"
        />
        <div class="container-right">
            <div class="nav-menu">
                <a href="#" class="active">About</a>
                <a href="#">Map</a>
                <a href="#">Zoos</a>
                <a href="#">Contact Us</a>
                <a href="#">Design</a>
            </div>
            <div class="social-media">
                <img src="../../assets/images/youtube.png" alt="Youtube Logo">
                <img src="../../assets/images/instagram.png" alt="Instagram Logo">
                <img src="../../assets/images/facebook.png" alt="Facebook Logo">
            </div>
        </div>
    </header>
    <main>
        <section class="main-intro">
            <div class="main-header">Watch your favorite animal online</div>
            <div class="main-subheader">Explore the exciting and mysterious world of wild animals in a natural setting without leaving your home.</div>
            <button>
                <div class="btn-text">View live cam</div>
                <img src="../../assets/images/union.png" alt="Union image">
            </button>
        </section>
    </main>
    <footer>

    </footer>
