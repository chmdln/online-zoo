<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../../assets/icons/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../../components/header/style.css">
    <link rel="stylesheet" href="../../components/footer/style.css">
    <script type="module" src="./script.js"></script>
    <title>Sign In</title>
</head>
<body>
    <div id="header"></div>
    <div class="signin-container">
        <form class="signin-form">
            <h2 class="h2-heading">Sign In</h2>

            <label for="login">
                <span class="required">*</span> Login
            </label>
            <div class="input-group">
                <input type="text" id="login" placeholder="Enter login">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>
            
            <label for="password">
                <span class="required">*</span> Password
            </label>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter password">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>
            <button type="submit" class="btn-text">
                Sign In
            </button>
        </form>
        <small class="signin-error error-message"></small>
    </div>
    <div id="footer"></div>
</body>
</html>
