<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../../components/header/style.css">
    <link rel="stylesheet" href="../../components/footer/style.css">
    <script type="module" src="./script.js"></script>
    <title>Sign Up</title>
</head>
<body>
    <div id="header"></div>
    <div class="signup-container">
        <form class="signup-form">
            <h2 class="h2-heading">Create an account</h2>

            <label for="login">
                <span class="required">*</span> Login
            </label>
            <div class="input-group">
                <input type="text" id="login" placeholder="Enter login">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>
            
            <label for="password">
                <span class="required">*</span> Password
            </label>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter password">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>
            

            <label for="confirm-password">
                <span class="required">*</span> Confirm Password
            </label>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm password">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>

            <label for="name">
                <span class="required">*</span> Name 
            </label>
            <div class="input-group">
                <input type="text" id="name" placeholder="Enter your name">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>

            <label for="email">
                <span class="required">*</span> Email 
            </label>
            <div class="input-group">
                <input type="email" id="email" placeholder="Enter your email">
                <div class="error-icon">!</div>
                <small class="error-message"></small>
            </div>
            <button type="submit" class="btn-text">
                Register
            </button>
        </form>
        <small class="signup-error error-message"></small>
    </div>
    <div id="footer"></div>
</body>
</html>
