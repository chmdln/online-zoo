<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- head base -->
<ellipse cx="60" cy="60" rx="36" ry="34" fill="white"/>
<!-- ears -->
<ellipse cx="33" cy="24" rx="12" ry="14" fill="white"/>
<ellipse cx="87" cy="24" rx="12" ry="14" fill="white"/>
<!-- ear inner contour -->
<ellipse cx="33" cy="24" rx="6.5" ry="8.5" fill="#20113D" opacity="0.25"/>
<ellipse cx="87" cy="24" rx="6.5" ry="8.5" fill="#20113D" opacity="0.25"/>
<!-- dark crown cap -->
<path d="M34 46 Q60 26 86 46 Q78 38 60 36 Q42 38 34 46Z" fill="#20113D"/>
<!-- eye mask rings -->
<ellipse cx="45" cy="56" rx="12" ry="11" fill="#20113D"/>
<ellipse cx="75" cy="56" rx="12" ry="11" fill="#20113D"/>
<!-- eye whites -->
<circle cx="45" cy="56" r="6.5" fill="white" opacity="0.5"/>
<circle cx="75" cy="56" r="6.5" fill="white" opacity="0.5"/>
<!-- eye pupils -->
<circle cx="45" cy="56" r="4" fill="#20113D"/>
<circle cx="75" cy="56" r="4" fill="#20113D"/>
<!-- eye shine -->
<circle cx="46" cy="55" r="1.3" fill="white"/>
<circle cx="76" cy="55" r="1.3" fill="white"/>
<!-- pointed snout -->
<path d="M51 66 Q60 82 69 66 Q64 61 60 60 Q56 61 51 66Z" fill="#20113D"/>
<ellipse cx="60" cy="65" rx="4" ry="3" fill="#20113D"/>
<!-- nose bridge stripe -->
<rect x="58.5" y="36" width="3" height="18" rx="1.5" fill="#20113D"/>
</svg>
