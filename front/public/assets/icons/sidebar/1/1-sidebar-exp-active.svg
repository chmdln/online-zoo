<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- head base -->
<ellipse cx="60" cy="60" rx="38" ry="36" fill="white"/>
<!-- ears outer -->
<ellipse cx="33" cy="26" rx="13" ry="13" fill="white"/>
<ellipse cx="87" cy="26" rx="13" ry="13" fill="white"/>
<!-- ear inner contour -->
<ellipse cx="33" cy="26" rx="7" ry="7" fill="#20113D" opacity="0.3"/>
<ellipse cx="87" cy="26" rx="7" ry="7" fill="#20113D" opacity="0.3"/>
<!-- eye patches -->
<ellipse cx="44" cy="56" rx="11" ry="10" fill="#20113D"/>
<ellipse cx="76" cy="56" rx="11" ry="10" fill="#20113D"/>
<!-- eye whites -->
<circle cx="44" cy="56" r="5.5" fill="white" opacity="0.5"/>
<circle cx="76" cy="56" r="5.5" fill="white" opacity="0.5"/>
<!-- eye pupils -->
<circle cx="44" cy="57" r="3.5" fill="#20113D"/>
<circle cx="76" cy="57" r="3.5" fill="#20113D"/>
<!-- eye shine -->
<circle cx="45" cy="56" r="1.2" fill="white"/>
<circle cx="77" cy="56" r="1.2" fill="white"/>
<!-- nose -->
<ellipse cx="60" cy="70" rx="5" ry="3.5" fill="#20113D"/>
<!-- mouth -->
<path d="M60 73.5 L60 76 M60 76 C57.5 78.5 54.5 78 53 77 M60 76 C62.5 78.5 65.5 78 67 77" stroke="#20113D" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
