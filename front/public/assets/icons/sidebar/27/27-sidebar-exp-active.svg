<ellipse cx="60" cy="70" rx="6" ry="4.5" fill="#20113D" opacity="0.85"/>
<ellipse cx="57" cy="69.5" rx="2.5" ry="2" fill="white" opacity="0.25"/>
<ellipse cx="63" cy="69.5" rx="2.5" ry="2" fill="white" opacity="0.25"/>
<!-- gentle smile -->
<path d="M52 76 Q60 82 68 76" stroke="#20113D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<!-- claws -->
<path d="M38 88 Q36 96 34 100" stroke="#20113D" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
<path d="M44 90 Q43 98 42 102" stroke="#20113D" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
<path d="M76 90 Q77 98 78 102" stroke="#20113D" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
<path d="M82 88 Q84 96 86 100" stroke="#20113D" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
