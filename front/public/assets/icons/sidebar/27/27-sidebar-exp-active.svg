<!-- dark eye mask band -->
<path d="M28 52 Q60 46 92 52 Q92 62 60 64 Q28 62 28 52Z" fill="#20113D" opacity="0.88"/>
<!-- eyes large sleepy -->
<ellipse cx="45" cy="55" rx="10" ry="9" fill="white"/>
<ellipse cx="75" cy="55" rx="10" ry="9" fill="white"/>
<circle cx="45" cy="55" r="5.5" fill="#20113D" opacity="0.28"/>
<circle cx="75" cy="55" r="5.5" fill="#20113D" opacity="0.28"/>
