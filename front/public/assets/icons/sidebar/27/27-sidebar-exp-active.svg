<path d="M35 52 Q45 49 55 52" stroke="#20113D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M65 52 Q75 49 85 52" stroke="#20113D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="45" cy="56" r="3.2" fill="#20113D"/>
<circle cx="75" cy="56" r="3.2" fill="#20113D"/>
<circle cx="46" cy="55" r="1.1" fill="white"/>
<circle cx="76" cy="55" r="1.1" fill="white"/>
