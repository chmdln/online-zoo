<ellipse cx="22" cy="64" rx="9" ry="11" fill="white" opacity="0.85"/>
<ellipse cx="98" cy="64" rx="9" ry="11" fill="white" opacity="0.85"/>
<ellipse cx="22" cy="64" rx="4.5" ry="5.5" fill="#20113D" opacity="0.2"/>
<ellipse cx="98" cy="64" rx="4.5" ry="5.5" fill="#20113D" opacity="0.2"/>
