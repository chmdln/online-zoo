<ellipse cx="43" cy="56" rx="8" ry="7.5" fill="white"/>
<ellipse cx="77" cy="56" rx="8" ry="7.5" fill="white"/>
<circle cx="43" cy="56" r="4" fill="#20113D" opacity="0.28"/>
<circle cx="77" cy="56" r="4" fill="#20113D" opacity="0.28"/>
<circle cx="43" cy="56" r="2.4" fill="#20113D"/>
<circle cx="77" cy="56" r="2.4" fill="#20113D"/>
<circle cx="44" cy="55" r="0.9" fill="white"/>
<circle cx="78" cy="55" r="0.9" fill="white"/>
</svg>
